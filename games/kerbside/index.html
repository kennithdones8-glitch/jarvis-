<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kerbside Grand Prix</title>
<link rel="stylesheet" href="racer.css">
<style>
  @font-face { font-family: "Rajdhani"; font-weight: 500; font-display: swap; src: url("fonts/rajdhani-500.woff2") format("woff2"); }
  @font-face { font-family: "Rajdhani"; font-weight: 600; font-display: swap; src: url("fonts/rajdhani-600.woff2") format("woff2"); }
  @font-face { font-family: "Rajdhani"; font-weight: 700; font-display: swap; src: url("fonts/rajdhani-700.woff2") format("woff2"); }
  html, body { height: 100%; margin: 0; }
  body { background: #050403; color: #fbf6ec; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); }
  header h1 { margin: 0; font: 700 18px "Rajdhani", system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #d9b45f; }
  header p { margin: 0; font-size: 13px; color: #b9aa91; }
  #game { flex: 1; min-height: 0; padding: 0 max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(8px, env(safe-area-inset-left, 0px)); }
  #game .race-stage { height: 100%; min-height: 300px; }
  noscript { padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>Kerbside Grand Prix</h1>
  <p id="status" role="status" aria-live="polite">Career, garage and championships · Arrows or WASD · Space for nitro · P to pause</p>
</header>
<main id="game"></main>
<noscript>This game needs JavaScript turned on.</noscript>
<script src="racer-data.js"></script>
<script src="racer-career.js"></script>
<script src="racer-audio.js"></script>
<script src="racer.js"></script>
<script src="racer-modes.js"></script>
<script src="racer-render.js"></script>
<script src="racer-ui.js"></script>
<script>
  const status = document.getElementById("status");
  document.getElementById("game").append(JarvisRacer.mount({ onStatus: (t) => { status.textContent = t; } }));
</script>
</body>
</html>
