<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>JARVIS</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="stopbar" class="stopbar" hidden>
  <span id="stoptext"></span>
  <button id="release" class="btn btn-ghost">Release stop</button>
</div>
<header class="top">
  <div class="brand">
    <div id="orb" class="orb" data-state="online" aria-hidden="true"><i></i><i></i><i></i></div>
    <div>
      <div class="wordmark">J.A.R.V.I.S.</div>
      <div id="statusline" class="statusline" role="status" aria-live="polite">Connecting…</div>
    </div>
  </div>
  <div class="top-right">
    <span id="clock" class="mono muted"></span>
    <button id="estop" class="btn btn-danger" title="Stop all tasks and block new actions">Emergency stop</button>
  </div>
</header>

<main class="grid">
  <section class="panel command" aria-labelledby="cmd-h">
    <div class="panel-head">
      <h2 id="cmd-h">Command</h2>
      <div class="tabs" role="tablist" aria-label="Mode">
        <button role="tab" id="tab-ask" aria-selected="true" class="tab">Ask</button>
        <button role="tab" id="tab-do" aria-selected="false" class="tab">Do</button>
      </div>
    </div>
    <p id="modehint" class="hint"></p>
    <form id="cmdform" class="cmdform">
      <label for="cmd" class="sr">Message</label>
      <textarea id="cmd" rows="3" placeholder="Ask JARVIS…" autocomplete="off"></textarea>
      <button class="btn btn-primary" id="send" type="submit">Send</button>
    </form>
    <div id="jobs" class="stack"></div>
    <div id="convo" class="convo" aria-live="polite"></div>
  </section>

  <section class="panel missions-panel" aria-labelledby="mis-h">
    <div class="panel-head"><h2 id="mis-h">Missions</h2><span id="miscount" class="muted mono"></span></div>
    <div id="missions" class="stack"></div>
  </section>

  <div class="col">
    <section class="panel attention-panel" aria-labelledby="ap-h">
      <div class="panel-head"><h2 id="ap-h">Approvals</h2><span id="apcount" class="muted mono"></span></div>
      <div id="approvals" class="stack"></div>
    </section>
    <section class="panel systems-panel" aria-labelledby="sys-h">
      <div class="panel-head"><h2 id="sys-h">Systems</h2></div>
      <div id="system"></div>
    </section>
    <section class="panel activity-panel" aria-labelledby="act-h">
      <div class="panel-head"><h2 id="act-h">Activity</h2></div>
      <ol id="activity" class="activity"></ol>
    </section>
  </div>
</main>
</body>
</html>
