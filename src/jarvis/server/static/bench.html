<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070504">
<title>JARVIS · Benchmarks</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/bench.css">
<script src="/static/bench.js" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<header class="top">
  <div class="wordmark">J.A.R.V.I.S.<span>Benchmarks</span></div>
  <div class="top-right"><button id="estop" class="btn btn-danger" type="button" title="Pause every task and block new actions">Emergency stop</button></div>
</header>
<nav class="sidenav" id="sidenav" aria-label="Sections">
  <a href="/#/home" title="Home"><span class="ni" aria-hidden="true">◎</span><span class="nl">Home</span></a>
  <a href="/#/missions" title="Missions"><span class="ni" aria-hidden="true">▤</span><span class="nl">Missions</span></a>
  <a href="/#/decisions" title="Decisions"><span class="ni" aria-hidden="true">◆</span><span class="nl">Decisions</span></a>
  <a href="/#/memory" title="Memory"><span class="ni" aria-hidden="true">✦</span><span class="nl">Memory</span></a>
  <a href="/#/systems" title="Systems"><span class="ni" aria-hidden="true">≡</span><span class="nl">Systems</span></a>
  <div class="nav-more">
    <a href="/#/intelligence" title="Briefing &amp; ideas"><span class="ni" aria-hidden="true">✧</span><span class="nl">Briefing &amp; ideas</span></a>
    <a href="/bench" aria-current="page" title="Benchmarks"><span class="ni" aria-hidden="true">▥</span><span class="nl">Benchmarks</span></a>
    <a href="/trust" title="Trust"><span class="ni" aria-hidden="true">⛨</span><span class="nl">Trust</span></a>
  </div>
</nav>

<main class="page bench">
  <section class="panel" aria-labelledby="cmp-h">
    <header class="ph"><h2 id="cmp-h">Before / after</h2></header>
    <div class="b-pick">
      <label>Before <select id="before"></select></label>
      <label>After <select id="after"></select></label>
    </div>
    <div id="compare" class="b-body" aria-live="polite"><p class="b-muted">Loading…</p></div>
  </section>

  <section class="panel" aria-labelledby="runs-h">
    <header class="ph"><h2 id="runs-h">Runs</h2><span id="runcount" class="ph-count"></span></header>
    <div id="runs" class="b-body"></div>
  </section>

  <section class="panel" aria-labelledby="run-h" id="runpanel" hidden>
    <header class="ph"><h2 id="run-h">Run</h2></header>
    <div id="run" class="b-body"></div>
  </section>
</main>
</body>
</html>
