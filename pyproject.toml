[project]
name = "jarvis"
version = "0.16.2"
description = "JARVIS personal AI system: kernel (tasks, permissions, audit, kill switch)"
requires-python = ">=3.12"
# The kernel deliberately has no runtime dependencies beyond the standard library.
dependencies = [
    "cryptography>=42",
    "pypdf>=5",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
