[project]
name = "jarvis"
version = "0.17.11"
description = "JARVIS: a permissioned, auditable personal AI system for Mac and iPhone"
requires-python = ">=3.12"
# The kernel (src/jarvis/core) uses only the standard library; these serve documents, passkeys/push/backups and
# calendar repeat rules.
dependencies = [
    "cryptography>=42",
    "pypdf>=5",
    "python-dateutil>=2.9,<3",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff==0.6.9"]  # ruff pinned: `jarvis gate` must give the same answer everywhere

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
