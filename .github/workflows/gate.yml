# The release gate and recovery drills on real machines: an Intel Mac (like the owner's), an Apple-silicon Mac and
# Linux. Free for public repositories. Read-only: it can't push, publish or reach any account, and it holds no
# secrets. It cannot test the owner's own Calendar, Tailscale or iPhone; those still need `jarvis` on the Mac.
name: Release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Actions pinned to exact commits (not movable tags).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca  # v6.0.1
      - name: Install (exactly the locked versions)
        run: uv sync --locked
      - name: Release gate (full tests, linter, every security item)
        run: uv run jarvis --home "$RUNNER_TEMP/jarvis-home" gate
      - name: Recovery drills (throwaway JARVIS, real crashes)
        run: uv run jarvis --home "$RUNNER_TEMP/jarvis-home" drill
