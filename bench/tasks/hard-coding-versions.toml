id = "hard-coding-versions"
set = "hard"
category = "coding"
title = "Write a function (hidden tests): compare version numbers"
mode = "chat"
time_limit_s = 400
prompt = """
Write a Python function `compare_versions(a, b)` that compares two version strings made of numbers separated by dots,
such as "1.10" and "1.9". Return -1 if a is older, 1 if a is newer, and 0 if they are the same. Compare each part as
a number, and treat missing parts as 0 (so "1.0" equals "1"). Reply with the function in one Python code block.
"""

[[checks]]
type = "contains_all"
values = ["def compare_versions"]
[[checks]]
type = "code_tests"
function = "compare_versions"
cases = [
  [["1.10", "1.9"], 1],
  [["1.0", "1"], 0],
  [["2", "10"], -1],
  [["1.2.3", "1.2.3"], 0],
  [["1.2", "1.2.1"], -1],
  [["1.0.0.0", "1"], 0],
  [["0.9.9", "0.10"], -1],
]
