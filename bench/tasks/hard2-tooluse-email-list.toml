id = "hard2-tooluse-email-list"
set = "hard2"
category = "tool_use"
title = "Read a file, then draft an email with it"
mode = "do"
time_limit_s = 900
prompt = "Read groceries.txt in my notes folder and draft an email to sam@example.com with the list."

[setup]
files = [
  { path = "notes/groceries.txt", content = "Groceries\n- eggs\n- basil\n- rye bread\n- lemons\n" },
]

[approve]
match = ["sam@example.com"]

[[checks]]
type = "mac_call"
script = "mail.draft"
fields = { to = "sam@example.com", body = "basil" }
[[checks]]
type = "approvals"
min = 1
max = 1
