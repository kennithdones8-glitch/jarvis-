id = "tooluse-email-draft"
set = "extended"
category = "tool_use"
title = "Draft an email (never sent)"
mode = "do"
time_limit_s = 600
prompt = "Draft an email to sam@example.com telling Sam the meeting has moved to Friday at 3pm."

[approve]
match = ["sam@example.com"]

[[checks]]
type = "mac_call"
script = "mail.draft"
fields = { to = "sam@example.com", body = "friday" }
[[checks]]
type = "approvals"
min = 1
max = 1
