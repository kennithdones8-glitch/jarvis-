id = "hard2-recovery-no-address"
set = "hard2"
category = "recovery"
title = "Ask for an email address JARVIS doesn't have"
mode = "do"
time_limit_s = 600
prompt = "Email the standup notes in my notes folder to Priya."

[setup]
files = [
  { path = "notes/standup.txt", content = "Standup, Tuesday\nThe beta shipped. Priya fixes the login bug.\n" },
]

[approve]
match = []

[[checks]]
type = "asked"
[[checks]]
type = "approvals"
min = 0
max = 0
