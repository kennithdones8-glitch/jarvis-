id = "hard2-planning-busiest"
set = "hard2"
category = "planning"
title = "Which of the next three days has the most booked"
mode = "chat"
time_limit_s = 400
prompt = "Over the next three days, which day has the most hours booked? List that day's events."

[setup.mac]
events = [
  { title = "Team sync", day = 1, start = "09:00", end = "10:00", calendar = "Work" },
  { title = "Dentist", day = 1, start = "15:00", end = "16:00" },
  { title = "Workshop", day = 2, start = "09:00", end = "12:00", calendar = "Work" },
  { title = "Client lunch", day = 2, start = "12:30", end = "14:00", calendar = "Work" },
  { title = "Board prep", day = 2, start = "15:00", end = "15:30", calendar = "Work" },
  { title = "Gym", day = 3, start = "07:00", end = "08:00" },
  { title = "Dinner with Ana", day = 3, start = "19:00", end = "21:30" },
]

[[checks]]
type = "contains_all"
values = ["workshop", "client lunch", "board prep"]
