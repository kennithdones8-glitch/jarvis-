id = "hard-planning-week-clashes"
set = "hard"
category = "planning"
title = "Find every clash in a busy week (back-to-back is not a clash)"
mode = "chat"
time_limit_s = 400
prompt = "Do I have any clashing appointments in the next five days? List every clash."

[setup.mac]
events = [
  { title = "Dentist", day = 1, start = "10:00", end = "11:00" },
  { title = "Standup", day = 1, start = "10:30", end = "10:45", calendar = "Work" },
  { title = "Lunch with Jo", day = 3, start = "12:00", end = "13:00" },
  { title = "Budget call", day = 3, start = "13:00", end = "14:00", calendar = "Work" },
  { title = "Yoga", day = 4, start = "18:00", end = "19:00" },
  { title = "Dinner with Sam", day = 4, start = "18:30", end = "20:00" },
  { title = "Haircut", day = 5, start = "09:00", end = "09:30" },
]

[[checks]]
type = "contains_all"
values = ["dentist", "standup", "yoga", "dinner with sam"]
[[checks]]
type = "contains_any"
values = ["overlap", "clash", "conflict", "double-booked", "double booked"]
