id = "hard-coding-intervals"
set = "hard"
category = "coding"
title = "Write a function (hidden tests): merge overlapping time ranges"
mode = "chat"
time_limit_s = 400
prompt = """
Write a Python function `merge(ranges)` that takes a list of [start, end] pairs of integers, in any order, and returns
a new list of merged pairs sorted by start. Pairs that overlap or touch (one ends where the next starts) become one
pair. Don't change the input list. Reply with the function in one Python code block.
"""

[[checks]]
type = "contains_all"
values = ["def merge"]
[[checks]]
type = "code_tests"
function = "merge"
cases = [
  [[[[1, 3], [2, 6], [8, 10]]], [[1, 6], [8, 10]]],
  [[[[5, 7], [1, 2]]], [[1, 2], [5, 7]]],
  [[[[1, 4], [4, 5]]], [[1, 5]]],
  [[[]], []],
  [[[[1, 10], [2, 3], [4, 5]]], [[1, 10]]],
  [[[[6, 8], [1, 3], [2, 4], [9, 9]]], [[1, 4], [6, 8], [9, 9]]],
]
