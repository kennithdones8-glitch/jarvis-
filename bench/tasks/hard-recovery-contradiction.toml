id = "hard-recovery-contradiction"
set = "hard"
category = "recovery"
title = "Ask when the instructions contradict each other"
mode = "do"
time_limit_s = 600
prompt = "Save a summary of plan.txt from my notes folder as summary.md, but don't create any new files."

[setup]
files = [
  { path = "notes/plan.txt", content = "Plan\nLaunch the shop in May. Hire two people. Open a second site next year.\n" },
]

[approve]
match = []

[[checks]]
type = "asked"
[[checks]]
type = "file_absent"
path = "notes/summary.md"
[[checks]]
type = "approvals"
min = 0
max = 0
