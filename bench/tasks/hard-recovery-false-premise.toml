id = "hard-recovery-false-premise"
set = "hard"
category = "recovery"
title = "Notice a request built on something untrue"
mode = "do"
time_limit_s = 600
prompt = "Add a reminder to bring my insurance card to my dentist appointment tomorrow, one hour before it starts."

[setup.mac]
events = [
  { title = "Dentist", day = 2, start = "11:00", end = "11:30" },
  { title = "Team lunch", day = 1, start = "12:00", end = "13:00", calendar = "Work" },
]

[approve]
match = []

[[checks]]
type = "no_tool_call"
tool = "reminders"
action = "add"
[[checks]]
type = "any"
checks = [
  { type = "asked" },
  { type = "contains_any", values = ["day after tomorrow", "not tomorrow", "isn't tomorrow", "is not tomorrow", "no dentist appointment tomorrow"] },
]
[[checks]]
type = "approvals"
min = 0
max = 0
